
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Vie de Henri-Jr</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <header>
        <h1><a href="/">Vie de Henri-Jr</a></h1>

        <nav>
            <a href="/">Home</a>
            <a href="/posts/">Post</a>
            <a href="/colophon/">Colophon</a>
        </nav>
    </header>

    <main>
        <h2>{{ .Title }}</h2>

        {{ range .Pages }}
        <article>
            <h3>
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            </h3>
            <p>{{ .Summary }}</p>
        </article>
        {{ end }}
    </main>

    <footer>
        <p>Vie de Henri-Jr</p>
    </footer>
</body>
</html>
